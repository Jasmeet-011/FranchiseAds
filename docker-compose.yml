services:
  postgres:
    image: postgres:16
    container_name: franchiseads-postgres
    environment:
      POSTGRES_DB: franchiseads
      POSTGRES_USER: ${DB_USERNAME:-franchiseads}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-franchiseads}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
