services:
  postgres:
    image: postgres:16
    container_name: franchiseads-postgres
    environment:
      POSTGRES_DB: franchiseads
      POSTGRES_USER: ${DB_USERNAME:-franchiseads}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-franchiseads}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full stack: docker compose --profile app up -d --build. Plain "docker compose up -d" starts only Postgres (ADR-035).
  app:
    profiles: [app]
    build: .
    image: franchiseads:local
    container_name: franchiseads-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres by its service name. Not taken from .env, whose DB_URL is for running the app on the host.
      DB_URL: jdbc:postgresql://postgres:5432/franchiseads
      DB_USERNAME: ${DB_USERNAME:-franchiseads}
      DB_PASSWORD: ${DB_PASSWORD:-franchiseads}
      # Passed through from the shell or .env at "up" time; never stored in this file or the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Defaults repeat application.yml's: an empty ANTHROPIC_MODEL would fail startup instead of falling back.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
