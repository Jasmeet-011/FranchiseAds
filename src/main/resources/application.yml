spring:
  application:
    name: franchiseads

  # Local runs read ./.env if it exists; real environment variables still take precedence.
  config:
    import: optional:file:.env[.properties]

  # Defaults match docker-compose.yml for local dev; override via env vars everywhere else.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/franchiseads}
    username: ${DB_USERNAME:franchiseads}
    password: ${DB_PASSWORD:franchiseads}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks entities against it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

franchiseads:
  # Everything else has a default in ClaudeProperties. A missing key doesn't stop startup;
  # ClaudeClient refuses to call the API without one (ADR-021).
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}

management:
  endpoints:
    web:
      exposure:
        include: health
